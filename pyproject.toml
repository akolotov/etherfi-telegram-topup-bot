[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "etherfi-topup-bot"
version = "0.1.0"
description = "ether.fi Telegram bot that monitors configured users and starts the top-up flow when a target account needs attention."
requires-python = ">=3.12"
dependencies = [
    "eth-abi>=5.2.0",
    "eth-account>=0.13.7",
    "hexbytes>=1.3.1",
    "httpx>=0.28.0",
    "packaging>=26.0",
    "python-telegram-bot[webhooks]>=22.5",
    "safe-eth-py>=7.20.0",
    "web3>=7.16.0",
]

[project.scripts]
etherfi-topup-bot = "etherfi_bot.runtime:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
