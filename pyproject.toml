[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "etherfi-bot"
version = "0.1.0"
description = "FSM core for an ether.fi Telegram top-up bot"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
etherfi-bot = "etherfi_bot.runtime:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
